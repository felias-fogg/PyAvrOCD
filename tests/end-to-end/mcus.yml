# List of all covered MCUs in YAML format
devices:

# some virtual devices that can be imported to make the actual
# specifications more concise

# The classic ATtinys
  classic_tiny:
    virtual: true
    provides:
      dw: true
      arduino: true
      cadc: true
    clocks: [ 1, 4, 8, 16 ]
    architecture: avr
    core: TinyCore

# Small classic Megas with debugWIRE interface
  classic_tiny_mega:
    virtual: true
    provides:
      dw: true
      arduino: true
      cadc: true
      nolto: true
      boot: true
    clocks: [ 1, 4, 8, 16 ]
    LTO: Os
    architecture: avr
    core: MiniCore

# The small Megas without a core
  classic_tiny_mega_nocore:
    virtual: true
    import: classic_tiny_mega
    clocks: [ 1, 8, 16 ]
    core: NoCore

# Arduino boards with classic AVRs
  arduino_avr:
    virtual: true
    provides:
      cadc: true
      arduino: true
      nolto: true
      boot: true
    architecture: avr
    core: arduino

# Classic Megas with JTAG
  classic_mega:
    virtual: true
    provides:
      jtag: true
      arduino: true
      cadc: true
      nolto: true
      boot: true
    clocks: [ 1, 4, 8, 16 ]
    LTO: Os
    architecture: avr

# Modern ATtinys (with UPDI)
  modern_tiny:
    virtual: true
    provides:
      updi: true
      arduino: true
      boot: true
    clocks: [ 1, 2, 4, 5, 8, 10, 16, 20 ]
    core: megaTinyCore
    architecture: megaavr

# Modern Megas (with UPDI)
  modern_mega:
    virtual: true
    import: modern_tiny
    core: MegaCoreX

# The modern AVR series
  modern_avr:
    virtual: true
    import: modern_tiny
    core: DxCore

# Arduino boards with modern Megas, e.g., Nano Every
  arduino_megaavr:
    virtual: true
    provides:
      cadc: false
      arduino: true
      nolto: true
      boot: true
    architecture: megaavr
    core: arduino

####################### Classic MicroTinys (MicroCore) ##################################

  attiny13:
    mcu: attiny13
    provides:
      dw: true
      arduino: true
      ram: 0.0625
      flash: 1
    clocks: [ 1.2, 9.6 ]
    core: MicroCore
    board: '13'
    setup: ATtiny85/13 dev Board or Programmer-ZF socket

  attiny13a:
