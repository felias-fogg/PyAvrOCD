tests:
  prolog:
    virtual: true
    steps:
      - stimulus: set style enabled off
      - stimulus: set trace-commands on
      - stimulus: set logging overwrite on
      - stimulus: set logging on
      - stimulus: target remote :2000
      - stimulus: !rm pyavrocd.options
      - stimulus: monitor debugwire enable
        response:
          - enabled
          - This is not a debugWIRE target

  epilog:
    virtual: true
    steps:
      - stimulus: detach
        response: Detaching from
      - stimulus: quit

  # check whether we can recognize a set lockbit
  nolock: 
    sketch: nolock
    steps:
      - stimulus: set logging file log/nolock.log
      - stimulus: monitor info
        success: mEDBG CMSIS-DAP           # ignore on Xplained Mini boards
      - stimulus: monitor debugwire enable # try to move us into debugwire mode (if possible)
      - stimulus: monitor info
        response:                          # There should be an error message
          - Last critical error:      Debugging is impossible when lockbits are set.
          - Lock bits are set, but not managed by dw-link
      - import: epilog

  # start 'LiveTests' monitor command 
  live: 
    steps:
      - stimulus: set logging file log/live.log
      - import: prolog
      - stimulus: monitor reset
      - stimulus: info reg pc              # after reset PC should have value 0x0
        response: 0x0
      . stimulus: monitor LiveTests
        response:
          - live tests successfully finished
          - Not implemented
      - import: epilog

  # This is a blink program in C not using Arduino
  cblink:
    sketch: cblink
    steps:
      - stimulus: set logging file log/cblink.log
      - import: prolog
      - stimulus: monitor atexit stay
        response:
          - MCU will stay in debug mode on exit
          - Stay in debugWIRE at exit
      - stimulus: load
        timeout: 20
        response: Start address 0x
      - stimulus: break episode
        response: Breakpoint 1
      - stimulus: continue
        response: Breakpoint 1
      - stimulus: next
        response: setBit(LED2_PORT, LED2)
      - stimulus: break
        response: Breakpoint 2
      - stimulus: ignore 2 3
      - stimulus: delete 1
      - stimulus: continue
        response: Breakpoint 2
      - stimulus: next
        response: _delay_ms
      - stimulus: next
        response: clearBit(LED1_PORT, LED1);
      - import: epilog

  # Attaches to the previously run program
  attach: 
    serverargs: --attach
    steps:
      - stimulus: file sketches/cblink/cblink.elf
      - stimulus: set logging file log/attach.log
      - stimulus: set style enabled off
      - stimulus: set trace-commands on
      - stimulus: set logging overwrite on
      - stimulus: set logging on
      - stimulus: target remote :2000
      - stimulus: !rm pyavrocd.options
      - stimulus: monitor info
        success: dw-link  # dw-link cannot attach
      - stimulus: backtrace
        response: in main
      - stimulus: break episode
        response: Breakpoint 1
      - stimulus: continue
      - stimulus: print cnt
      - stimulus: print cnt > 3
        response:
          - = 1
          - = true
      - import: epilog

  smallpeekpoke:
    requires:
      updi: false
      ram_atmost: 0.125
    steps:
      - stimulus: set logging file log/peekpoke.log
      - import prolog
      - stimulus: x/i 0x0,
        response: "0x0:\trjmp\t.+" 
      - stimulus: set {char}0x800000=0xcd   # set sram location 0x0/0x1
      - stimulus: set {char}0x800001=0xab
      - stimulus: x/hx 0x800000             # check that 0x0/0x1 have been set the the value above
        response: "0x800000:\t0xabcd"
      - stimulus: info reg r1"              # and that 0x1 is the same as R1
        response: "r1             0xab"
      - stimulus: set {char}0x800005=0x56   # set 0x5
      - stimulus: set $r5=0x8c",            # set R5
      - stimulus: info reg r5",             # should be the value set to r5
      - response: "r5             0x8c"
      - stimulus: x/bx 0x800005             # which is identical to 0x5
        response: "0x800005:\t0x8c"          
      - stimulus: set {char}0x80005F=0x1F   # set sram location 0x5f
      - stimulus: info reg SREG             # this is SREG!
        response: "SREG           0x1f"
      - stimulus: x/bx 0x80005F             # steill same value
        response: "0x80005f:\t0x1f"
      - stimulus: set $SREG=0xF1"           # change SREG
      - stimulus: x/bx 0x80005F             # should now be the same as in 0x5f
        response: "0x80005f:\t0xf1"
      - stimulus: set $SP=0x123             # Set stack pointer
      - stimulus: monitor onlywhenloaded disable 
      - stimulus: si                        # make a jump
      - stimulus: x/hx 0x80005D             # MSB should be zero!
        response: "0x80005d:	0x0023"
      - stimulus: info reg SP               # identical value when quering SP
        response: "SP             0x23"
      - stimulus: set {int}0x80005D=0x00FF" # set LSB to 0xff
      - stimulus: si
      - stimulus: info reg SP               # and check register
        response: "SP             0xff"
      - stimulus: set {char}0x800060=0x34   # set RAM locations
      - stimulus: set {char}0x800061=0x12
      - stimulus: x/hx 0x800060             # and test
        response:  "0x800060:\t0x1234"
      - stimulus: set {char}0x810000=0xdc   # set EEPROM loc
      - stimulus: set {char}0x810001=0xfe
      - stimulus: x/hx 0x810000             # and test
        response: "0x810000:\t0xfedc
      - import: epilog
