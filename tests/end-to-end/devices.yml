# List of all covered boards and MCUs in YAML format
devices:

# some virtual devices that can be imported to make the actual
# specifications more concise

  classic_tiny:
    virtual: true
    provides:
      dw: true
      arduino: true
      cadc: true
    clocks: [ 1, 4, 8, 16 ]
    architecture: avr
    core: TinyCore

  classic_tiny_mega:
    virtual: true
    provides:
      dw: true
      arduino: true
      cadc: true
      nolto: true
    clocks: [ 1, 4, 8, 16 ]
    LTO: Os
    architecture: avr
    core: MiniCore

  classic_tiny_mega_nocore:
    virtual: true
    import: classic_tiny_mega
    clocks: [ 1, 8, 16 ]
    core: NoCore 

  arduino_avr:
    virtual: true
    provides:
      cadc: true
      arduino: true
      nolto: true
    architecture: avr
    core: arduino

  classic_mega:
    virtual: true
    provides:
      jtag: true
      arduino: true
      cadc: true
      nolto: true
    clocks: [ 1, 4, 8, 16 ]
    LTO: Os
    architecture: avr

  modern_tiny:
    virtual: true
    provides:
      updi: true
      arduino: true
    clocks: [ 1, 2, 4, 5, 8, 10, 16, 20 ]
    core: megaTinyCore
    architecture: megaavr

  modern_mega:
    virtual: true
    import: modern_tiny
    core: MegaCoreX

  modern_avr:
    virtual: true
    import: modern_tiny
    core: DxCore

  arduino_megaavr:
    virtual: true
    provides:
      cadc: false
      arduino: true
      nolto: true
    architecture: megaavr
    core: arduino

####################### Classic MicroTinys (MicroCore) ##################################

  attiny13:
    mcu: attiny13
    provides:
      dw: true
      arduino: true
      ram: 0.0625
      flash: 1
    clocks: [ 1.2, 9.6 ]
    core: MicroCore
    board: '13'
    setup: ATtiny85/13 dev Board or Programmer-ZF socket

  attiny13a:
    mcu: attiny13a
    import: attiny13

