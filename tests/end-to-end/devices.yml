    provides:
      ram: 0.5
      flash: 8
    setup: MCUdude dev board or Programmer-ZF socket

  - device: attiny441
    mcu: attiny441
    import: classic_tiny
    provides:
      ram: 0.25
      flash: 4
    setup: Breakout board on breadboard

  - device: attiny841
    mcu: attiny841
