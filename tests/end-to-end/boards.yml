# List of all covered boards in YAML format
devices:


####################### XMini Boards (XMiniCore) ##################################

  xmini328p:
    import: atmega328p
    core: XMiniCore
    clocks: [ 8, 16 ]
    board: atmega328p_xplained_mini
    setup: 328P Xmini board
    provides:
      nolock: true        # the mEDBG cannot write lock bits

  xmini328pb:
    import: atmega328pb
    core: XMiniCore
    clocks: [ 8, 16 ]
    board: atmega328pb_xplained_mini
    setup: 328PB Xmini board
    provides:
      nolock: true        # the mEDBG cannot write lock bits

  xmini168pb:
    import: atmega168pb
    core: XMiniCore
    clocks: [ 8, 16 ]
    board: atmega168pb_xplained_mini
    setup: 168PB Xmini board
    provides:
      nolock: true        # the mEDBG cannot write lock bits

  xmini817:
    import: attiny817
    setup: ATtiny817 Xplained Mini

####################### Arduino Boards (ArduinoCore-avr) ##################################

  uno:
    import: atmega328p
    core: arduino
    clocks: [ 8, 16 ]
    board: uno
    setup: Uno board with open RESET EN

####################### Arduino Boards (ArduinoCore-megaavr) ##################################

  uno-wifi:
    import: atmega4809
    pinout: uno_wifi

  nano-every:
    import: atmega4809
    pinout: nano_every
    setup: Arduino Nano Every

  thinary-nano-every:
    import: atmega4808
    pinout: nano_4808
    setup: Thinary Nano Every (ATmega4808)

####################### Olimex boards #####################################################

  avr-usb-162:
    import: at90usb162
    setup: Olimex AVR-USB-162

####################### Curiosity Nano boards #############################################

# The Curiosity Nano and Xplained boards need no entry of their own: the chip
# entries in mcus.yml carry the board and the setup string, because on those
# boards the chip is the board.
