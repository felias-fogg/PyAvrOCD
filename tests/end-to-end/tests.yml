          - "= true"
      - stimulus: monitor timers run
        response: Timers will run when execution is stopped
      - stimulus: continue
        response: Breakpoint 1
      - stimulus: set $t=curr
      - stimulus: print curr
      - stimulus: continue
        response: Breakpoint 1
      - stimulus: print curr
      - stimulus: print curr-$t > 1000
