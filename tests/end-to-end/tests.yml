# test whether CLI options concerning monitor commands are correctly passed
# on to GDB server
  monitor-options:
    serverargs: "--atexit=l --break=s --cach d --era d --load noinitialload --onlywhen=d --ra=d --single=i --ti f --verify disable"
    steps:
      - stimulus: set logging file log/monitor-options.log
      - import: prolog
      - stimulus: monitor atexit
        responses:
          - MCU will leave debug mode on exit
          - Leave debugWIRE at exit
      - stimulus: monitor atexit stay
        responses:
          - MCU will stay in debug mode on exit
          - Stay in debugWIRE at exit
      - stimulus: monitor breakpoints
        responses:
          - Only software breakpoints
          - On this MCU, only hardware breakpoints are allowed
      - stimulus: monitor caching
        responses:
          - Flash memory will not be cached,
          - Not implemented
      - stimulus: monitor erasebeforeload
        responses:
          - Flash memory will not be erased before loading executable
          - On debugWIRE targets, flash memory cannot be erased before loading executable
          - Not implemented
      - stimulus: monitor load
        responses:
          - Only reading, but no flashing
          - Only caching when loading
      - stimulus: monitor onlywhenloaded
        response: Execution is always possible
      - stimulus: monitor rangestepping
        responses:
          - Range stepping is disabled
          - No range stepping
      - stimulus: monitor singlestep interruptible
        response: Single-stepping is interruptible
      - stimulus: monitor timers
        responses:
          - Timers are frozen when execution is stopped,
          - On (U)PDI targets, timers are frozen when execution is stopped
      - stimulus: monitor verify
        response: Load operations are not verified
      - import: epilog

# test timer settings
  timers:
    requires:
      updi: false
      arduino: true
    sketch: timers
    steps:
      - stimulus: set logging file log/timers.log
      - import: prolog
      - stimulus: load
        timeout: 10
        response: Loading
      - stimulus: "break timers.ino:17"
        response: Breakpoint 1
      - stimulus: monitor timers freeze
        response: Timers are frozen when execution is stopped
      - stimulus: continue
        response: Breakpoint 1
      - stimulus: set $t=curr
      - stimulus: print curr
      - stimulus: continue
        response: Breakpoint 1
      - stimulus: print curr
      - stimulus: print curr-$t < 1000
        responses:
