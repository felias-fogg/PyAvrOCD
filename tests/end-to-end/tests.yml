tests:
  prolog:
    virtual: true
    steps:
      - stimulus: set style enabled off
      - stimulus: set trace-commands on
      - stimulus: set logging overwrite on
      - stimulus: set logging on
      - stimulus: "target remote :2000"
        timeout: 5
      - stimulus: "!rm pyavrocd.options"
      - stimulus: monitor debugwire enable
        timeout: 40
        responses:
          - enabled
          - This is not a debugWIRE target

  epilog:
    virtual: true
    steps:
      - stimulus: detach
        response: Detaching from
      - stimulus: quit

  # check whether we can recognize a set lockbit
  nolock: 
    sketch: nolock
    requires:
      updi: false
    steps:
      - stimulus: set logging file log/nolock.log
      - stimulus: set style enabled off
      - stimulus: set trace-commands on
      - stimulus: set logging overwrite on
      - stimulus: set logging enabled on
      - stimulus: "target remote :2000"
        timeout: 5
      - stimulus: "!rm pyavrocd.options"
      - stimulus: monitor info
        success: mEDBG CMSIS-DAP           # ignore on Xplained Mini boards
      - stimulus: monitor debugwire enable # try to move us into debugwire mode (if possible)
        timeout: 40
      - stimulus: monitor info
        responses:                          # There should be an error message
          - "Last critical error:      Debugging is impossible when lockbits are set."
          - "Lock bits are set, but not managed by dw-link"
      - import: epilog

  # start 'LiveTests' monitor command 
  live: 
    steps:
      - stimulus: set logging file log/live.log
      - import: prolog
      - stimulus: monitor reset
      - stimulus: info reg pc              # after reset PC should have value 0x0
        response: "0x0"
      - stimulus: monitor LiveTests
        timeout: 20
        responses:
          - live tests successfully finished
          - Not implemented
      - import: epilog

  # This is a blink program in C not using Arduino
  cblink:
    sketch: cblink
    steps:
      - stimulus: set logging file log/cblink.log
      - import: prolog
      - stimulus: monitor atexit stay
        responses:
          - MCU will stay in debug mode on exit
          - Stay in debugWIRE at exit
      - stimulus: load
        timeout: 20
        response: Start address 0x
      - stimulus: break episode
        response: Breakpoint 1
      - stimulus: continue
        response: Breakpoint 1
      - stimulus: next
        response: setBit(LED2_PORT, LED2)
      - stimulus: break
        response: Breakpoint 2
      - stimulus: ignore 2 3
      - stimulus: delete 1
      - stimulus: continue
        timeout: 5
        response: Breakpoint 2
      - stimulus: next
        response: _delay_ms
      - stimulus: next
        timeout: 5
        response: clearBit(LED1_PORT, LED1);
      - import: epilog

  # Attaches to the previously run program
  attach: 
    serverargs: --attach
    steps:
      - stimulus: file sketches/cblink/cblink.elf
      - stimulus: set logging file log/attach.log
      - stimulus: set style enabled off
      - stimulus: set trace-commands on
      - stimulus: set logging overwrite on
      - stimulus: set logging on
      - stimulus: target remote :2000
      - stimulus: "!rm pyavrocd.options"
      - stimulus: monitor info
        success: dw-link  # dw-link cannot attach
      - stimulus: backtrace
        response: in main
      - stimulus: break episode
        response: Breakpoint 1
      - stimulus: continue
      - stimulus: print cnt
      - stimulus: print cnt > 3
        responses:
          - = 1
          - = true
      - import: epilog

  # Basic peek and poke tha works on all classic MCUs
  basicpeekpoke:
    virtual: true
    steps:
      - stimulus: set logging file log/peekpoke.log
      - import: prolog
      - stimulus: "x/i 0x0"                # instruction at RESET vector
        responses:
          - "0x0:\trjmp"
          - "0x0:\tjmp"
      - stimulus: set {char}0x800000=0xcd   # set sram location 0x0/0x1
      - stimulus: set {char}0x800001=0xab
      - stimulus: x/hx 0x800000             # check that 0x0/0x1 have been set the the value above
        response: "0x800000:\t0xabcd"
      - stimulus: info reg r1               # and that 0x1 is the same as R1
        response: "r1             0xab"
      - stimulus: set {char}0x800005=0x56   # set 0x5
      - stimulus: set $r5=0x8c              # set R5
      - stimulus: info reg r5              # should be the value set to r5
        response: "r5             0x8c"
      - stimulus: "x/bx 0x800005"           # which is identical to 0x5
        response: "0x800005:\t0x8c"          
      - stimulus: set {char}0x80005F=0x1F   # set sram location 0x5f
      - stimulus: info reg SREG             # this is SREG!
        response: "SREG           0x1f"
      - stimulus: x/bx 0x80005F             # still same value
        response: "0x80005f:\t0x1f"
      - stimulus: set $SREG=0xF1            # change SREG
      - stimulus: x/bx 0x80005F             # should now be the same as in 0x5f
        response: "0x80005f:\t0xf1"
      - stimulus: set {char}0x810000=0xdc   # set EEPROM loc
      - stimulus: set {char}0x810001=0xfe
      - stimulus: x/hx 0x810000             # and test
        response: "0x810000:\t0xfedc"
        

  # Peek and poke for small classic MCUs
  smallpeekpoke:
    requires:
      updi: false
      ram_atmost: 0.125
    steps:
      - import: basicpeekpoke
      - stimulus: set $SP=0x123             # Set stack pointer
        timeout: 20
      - stimulus: monitor onlywhenloaded disable 
      - stimulus: si                        # make a jump
      - stimulus: x/hx 0x80005D             # MSB should be zero!
        response: "0x80005d:	0x0023"
      - stimulus: info reg SP               # identical value when quering SP
        response: "SP             0x23"
      - stimulus: set {int}0x80005D=0x00FF # set LSB to 0xff
      - stimulus: si
      - stimulus: info reg SP               # and check register
        response: "SP             0xff"
      - stimulus: set {char}0x800060=0x34   # set RAM locations
      - stimulus: set {char}0x800061=0x12
      - stimulus: x/hx 0x800060             # and test
        response:  "0x800060:\t0x1234"
      - import: epilog

# set/read memory cells (medium MCUs, some ram at 0x100)
  mediumpeekpoke:
    requires:
      updi: false
      ram_atleast: 0.25
      ram_atmost: 0.5
    steps:
      - import: basicpeekpoke
      - stimulus: set $SP=0x123
        timeout: 20
      - stimulus: monitor onlywhenloaded disable
      - stimulus: si
      - stimulus: x/hx 0x80005D
        response: "0x80005d:	0x0123"
      - stimulus: info reg SP
        response: SP             0x123
      - stimulus: set {int}0x80005D=0x00FF
      - stimulus: si
      - stimulus: info reg SP
        response: SP             0xff
      - import: epilog

## set/read memory cells (large MCUs, some ram at 0x3ff)
  mediumpeekpoke:
    requires:
      updi: false
      ram_atleast: 1
    steps:
      - import: basicpeekpoke
      - stimulus: set $SP=0x223
      - stimulus: monitor onlywhenloaded disable
      - stimulus: si
      - stimulus: x/hx 0x80005D
        response: "0x80005d:	0x0223"
      - stimulus: info reg SP
        response: SP             0x223
      - stimulus: set {int}0x80005D=0x03FF
      - stimulus: si
      - stimulus: info reg SP
        response: SP             0x3ff
      - import: epilog

## set/read memory cells (UPDI targets)
  updipeekpoke:
    requires:
      updi: true
    steps:
      - stimulus: set logging file log/peekpoke.log
      - import: prolog
      - stimulus: set {char}0x800000=0xcd
      - stimulus: set {char}0x800001=0xab
      - stimulus: x/hx 0x800000
        response: "0x800000:\t0xabcd"       # virtual port A / not general registers!
      - stimulus: info reg r1
        response: "r1             0x0"
      - stimulus: set {char}0x800001=0x56
      - stimulus: set $r1=0x8c
      - stimulus: info reg r1
        response: "r1             0x8c"     # general registers
      - stimulus: x/bx 0x800001
        response: "0x800001:\t0x56"         # versus virtual port A
      - stimulus: set {char}0x80003F=0x1F   # SREG
      - stimulus: info reg SREG
        response: "SREG           0x1f"
      - stimulus: x/bx 0x80003F
        response: "0x80003f:\t0x1f"
      - stimulus: set $SREG=0xF1
      - stimulus: x/bx 0x80003F
        response: "0x80003f:\t0xf1"
      - stimulus: set $SP=0xFFFF            # SP
        timeout: 20
      - stimulus: "print $SP==(*0x80003D+0x800000)"
        responses:
          - "= 1"
          - "= true"
      - stimulus: set {char}0x802800=0x34   # internal SRAM
      - stimulus: set {char}0x802801=0x12
      - stimulus: x/hx 0x802800
        response: "0x802800:\t0x1234"
      - stimulus: set {char}0x810000=0xdc   # EEPROM
      - stimulus: set {char}0x810001=0xfe
      - stimulus: x/hx 0x810000
        response: "0x810000:\t0xfedc"
      - stimulus: x/hx 0x801400
        response: "0x801400:\t0xfedc"       # EEPROM addressed through data space
      - stimulus: set {char}0x850000=0x56   # USER ROW
      - stimulus: set {char}0x850001=0x34
      - stimulus: x/hx 0x850000
        response: "0x850000:\t0x3456"
      # - stimulus: x/hx 0x801300
      #   response: "0x801300:\t0x3456" # USER ROW addressed in data space; is different for diff. families
      - import: epilog

# Tests all ways how signals are raised
# SIGHUP will be tested in the "off" script, SIGABRT cannot be tested
  signals: 
    sketch: break
    steps:
      - stimulus: set logging file log/signals.log
      - import: prolog
      - stimulus: cont
        response: SIGSEGV
      - stimulus: load 
        response: Start address 0x
      - stimulus: monitor break hardware
      - stimulus: break main
        response: Breakpoint 1
      - stimulus: cont
        response: "break.c:25"
      - stimulus: break 26
        response: line 26
      - stimulus: break 27
        response: line 27
      - stimulus: break 28
        response: line 28
      - stimulus: break 30
        response: line 30
      - stimulus: cont
        response: SIGSYS
      - stimulus: delete 1-5
      - stimulus: cont
        response: SIGTRAP
      - stimulus: cont
        response: SIGILL
      - stimulus: next
        response: SIGILL
      - stimulus: step
        response: SIGILL
      - stimulus: monitor reset
      - stimulus: break 32
      - stimulus: cont
      - stimulus: monitor info
        success: "Debugging interface:      updi" # skip next test for UPDI targets
      - stimulus: set $sp=0x5e
      - stimulus: cont
        response: SIGBUS
      - import: epilog

# Checks range stepping for debugWIRE targets
# _delay_ms (will be fast), loop with 2 exits (one of them a function call) will be fast,
# loop with real 2 exits will be slow, and one with 0 exits will be fast again.
# Finally, after a manual reset, we check that we indeed stop at the set (hardware) breakpoint
# and that executing the second loop is still fast.
  range_dw:
    requires:
      arduino: true
      dw: true
    sketch: range
    steps:
      - stimulus: set logging file log/range_dw.log
      - import: prolog
      - stimulus: load  
        response: Start address 0x
        timeout: 10
      - stimulus: "break range.ino:setup"
        response: Breakpoint 1
      - stimulus: cont
        response: LedInit
      - stimulus: next
        response: LedOn
      - stimulus: next
        response: _delay_ms
      - stimulus: next
        response: LedOff
      - stimulus: delete 1
      - stimulus: "break range.ino:loop"
        response: Breakpoint 2
      - stimulus: cont
        response: cnt = 0
      - stimulus: monitor info
        success: dw-link                    # dw-link will fail on the difficult tests
      - stimulus: next
        response: while
      - stimulus: next
        response: LedOff
      - stimulus: next
        response: cnt = 0
      - stimulus: next
        response: while
      - stimulus: next
        interrupt: 2                        # interrupt after 2 seconds
      - stimulus: print cnt
      - stimulus: print cnt > 1
        responses: 
          - "= true"
          - "= 1"
      - stimulus: print cnt < 100
        responses:
          - "= true"
          - "= 1"
      - stimulus: set cnt = 5000
      - stimulus: next
        response: cnt = 0
      - stimulus: next
        response: while
      - stimulus: monitor breakpoints hardware
      - stimulus: next
        interrupt: 3
      - stimulus: print cnt
      - stimulus: print cnt > 50000
        responses: 
          - "= true"
          - "= 1"
      - stimulus: monitor reset
        response: reset
      - stimulus: cont
        response: loop
      - import: epilog


# Checks range stepping for UPDI targets
# We will reduce the number of available HWBPs by one using hardware breakpoints only
# By doing so, we can reuse the rage_dw sketch.
# _delay_ms (will be fast), loop with 2 exits (one of them a function call) will be fast,
# loop with real 2 exits will be slow, and one with 0 exits will be fast again.
# Finally, after a manual reset, we check that we indeed stop at the set (hardware) breakpoint
# and that executing the second loop is still fast.
  range_updi:
    requires:
      arduino: true
      updi: true
    sketch: range
    steps:
      - stimulus: set logging file log/range_updi.log
      - import: prolog
      - stimulus: load
        timeout: 10
        response: Start address 0x
      - stimulus: monitor breakpoints hardware
        response: hardware
      - stimulus: "break range.ino:setup"
        response: Breakpoint 1
      - stimulus: cont
        response: LedInit
      - stimulus: next
        response: LedOn
      - stimulus: next
        response: _delay_ms
      - stimulus: next
        response: LedOff
      - stimulus: delete 1
      - stimulus: break range.ino:loop
        response: Breakpoint 2
      - stimulus: cont
        response: cnt = 0
      - stimulus: next
        response: while
      - stimulus: next
        response: LedOff
      - stimulus: next
        response: cnt = 0
      - stimulus: next
        response: while
      - stimulus: next
        interrupt: 4
      - stimulus: print cnt
      - stimulus: print cnt > 1
        responses: 
          - "= true"
          - "= 1"
      - stimulus: print cnt < 100
        responses: 
          - "= true"
          - "= 1"
      - stimulus: set cnt = 5000
      - stimulus: next
        response: cnt = 0
      - stimulus: next
        response: while
      - stimulus: next
        interrupt: 4
      - stimulus: print cnt
      - stimulus: print cnt > 50000
        responses: 
          - "= true"
          - "= 1"
      - stimulus: monitor reset
        response: reset
      - stimulus: cont
        response: Breakpoint 2, loop
      - stimulus: next
        response: while
      - stimulus: next
        response: LedOff
      - import: epilog

# Checks range stepping for JTAG targets
# Similar to above, but reserve 3 HWBPs
  range_jtag: 
    requires:
      arduino: true
      jtag: true
    sketch: range
    steps:
      - stimulus: set logging file log/range_jtag.log
      - import: prolog
      - stimulus: load
        timeout: 10
        response: Start address 0x
      - stimulus: monitor breakpoints hardware
        response: hardware
      - stimulus: break range.ino:setup
        response: Breakpoint 1
      - stimulus: "break range.ino:loop"
        response: Breakpoint 2
      - stimulus: "break main.cpp:main"
        response: Breakpoint 3
      - stimulus: cont
        response: init
      - stimulus: cont
        response: LedInit
      - stimulus: next
        response: LedOn
      - stimulus: next
        response: _delay_ms
      - stimulus: next
        response: LedOff
      - stimulus: cont
        response: cnt = 0
      - stimulus: next
        response: while
      - stimulus: next
        response: LedOff
      - stimulus: next
        response: cnt = 0
      - stimulus: next
        response: while
      - stimulus: next
        interrupt: 2
      - stimulus: print cnt
      - stimulus: print cnt > 1
        responses: 
          - "= true"
          - "= 1"
      - stimulus: print cnt < 100
        responses: 
          - "= true"
          - "= 1"
      - stimulus: set cnt = 5000
      - stimulus: next
        response: cnt = 0
      - stimulus: next
        response: while
      - stimulus: next
        interrupt: 3
      - stimulus: print cnt
      - stimulus: print cnt > 50000
        responses: 
          - "= true"
          - "= 1"
      - stimulus: monitor reset
        response: reset
      - stimulus: cont
        response: init
      - stimulus: next
        responses:
          - initVariant
          - setup
      - import: epilog

# Test sleep walking
  sleepwalk:
    requires:
      arduino: true
    sketch: sleepwalk
    steps:
      - stimulus: set logging file log/sleepwalk.log
      - import: prolog
      - stimulus: load
        timeout: 10
        response: Start address 0x
      - stimulus: "break sleepwalk.ino:13"
        response: Breakpoint 1
      - stimulus: "break sleepwalk.ino:loop"
        response: Breakpoint 2
      - stimulus: cont
        response: Breakpoint 2
      - stimulus: set TIMSK=0
      - stimulus: set TIMSK0=0
      - stimulus: cont
        response: sei
      - stimulus: next
        response: sleep_cpu
      - stimulus: p $pc
      - stimulus: step
        interrupt: 1
      - stimulus: p $pc
      - stimulus: print 1
      - import: epilog

