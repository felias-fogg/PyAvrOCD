        response: Start address 0x
      - stimulus: "b isr.ino:shortwait"
        response: Breakpoint 1
      - stimulus: cont
        response: shortwait
      - stimulus: next
        responses:
          - "}"
          - outsidecount
          - delay (ms=1)
      - stimulus: next
        responses:
          - outsidecount
          - digitalWrite
          - _delay_ms(1)
      - stimulus: cont
        response: shortwait
      - stimulus: next
        fail: __vectors
      - stimulus: next
        fail: __vectors
      - stimulus: next
        fail: __vectors
      - stimulus: next
        fail: __vectors
      - stimulus: next
        fail: __vectors
      - stimulus: cont
        response: shortwait
      - stimulus: next
        fail: __vectors
      - stimulus: next
        fail: __vectors
      - stimulus: next
        fail: __vectors
      - stimulus: next
        fail: __vectors
      - stimulus: next
        fail: __vectors
      - stimulus: cont
        response: shortwait
      - stimulus: monitor singlestep interruptible
        response: interruptible
      - stimulus: next
        success: __vectors
      - stimulus: next
        success: __vectors
      - stimulus: next
        success: __vectors
      - stimulus: next
        success: __vectors
      - import: epilog

