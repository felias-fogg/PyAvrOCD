name: Linting, unit tests and coverage

on:
  workflow_dispatch: # to run it manually
  push:
    paths:
      - '**.py'
    branches:
      - 'main'
  pull_request:


jobs:
  check:
    defaults:
      run:
        shell: bash
    runs-on: "ubuntu-latest"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Load cached venv
        id: cached-pip-wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Install library
        run: poetry install --no-interaction
      - name: Unit tests
        run: |
          source $VENV
          mypy .
          echo "PYLINT="`pylint -f json2 pyavrocd | python -c "import sys, json; print(json.load(sys.stdin)['statistics']['score'])"` >> $GITHUB_ENV
          pytest  --junitxml=pytest.xml --cov-report=term-missing --cov-report=json:cov.json --cov=pyavrocd tests/ | tee pytest-coverage.txt
        continue-on-error: true
      - name: Pytest coverage comment
        if: ${{ github.event_name != 'pull_request' }}
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
        continue-on-error: true
      - name: Result evaluation
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "PYTESTPERCENT="`python -c "import xml.etree.ElementTree as ET; el = ET.parse('pytest.xml').find('./testsuite'); tests=int(el.attrib['tests'])-int(el.attrib['skipped']); failed=int(el.attrib['errors'])+int(el.attrib['failures']); print('%.1f' % (100 - (failed/tests)*100))"`  >> $GITHUB_ENV
          echo "PYTESTCNT="`python -c "import xml.etree.ElementTree as ET; el = ET.parse('pytest.xml').find('./testsuite'); tests=int(el.attrib['tests'])-int(el.attrib['skipped']); print(tests)"`  >> $GITHUB_ENV
          echo "PYCOV="`python -c "import json; js=open('cov.json'); print('%.1f' % json.load(js)['totals']['percent_covered'])"` >> $GITHUB_ENV
        continue-on-error: true
      - name: Generate Pylint label
        if: ${{ github.event_name != 'pull_request' }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: c0d539e3ad0d10252d2aab8ad325246a
          filename: pylint.json
          label: pylint
          namedLogo: Python
          logoColor: white
          message: ${{ env.PYLINT }}
          valColorRange: ${{ env.PYLINT }}
          maxColorRange: 10.0
          minColorRange: 0
        continue-on-error: true
      - name: Generate Pytest label
        if: ${{ github.event_name != 'pull_request' }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: c0d539e3ad0d10252d2aab8ad325246a
          filename: pytest.json
          label: pytest
          namedLogo: Pytest
          logoColor: white
          message: "${{ env.PYTESTCNT }}: ${{ env.PYTESTPERCENT }}%"
          valColorRange: ${{ env.PYTESTPERCENT }}
          maxColorRange: 100.0
          minColorRange: 30.0
        continue-on-error: true
      - name: Generate coverage label
        if: ${{ github.event_name != 'pull_request' }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: c0d539e3ad0d10252d2aab8ad325246a
          filename: pycoverage.json
          label: coverage
          namedLogo: Pytest
          logoColor: white
          message: "${{ env.PYCOV }}%"
          valColorRange: ${{ env.PYCOV }}
          maxColorRange: 90.0
          minColorRange: 30.0

  # The job above tests the newest Python. This one tests the oldest the project
  # says it supports, because that is the one nobody develops on and therefore
  # the one that breaks unnoticed. Two deliberate differences from the job above:
  # the version is read out of pyproject.toml rather than written here, so that
  # raising the floor does not leave a stale number behind; and the install goes
  # through pip rather than poetry, resolving afresh instead of from the lock
  # file -- that is what a user gets, and it is the only way the day a dependency
  # drops the floor version becomes visible here.
  floor:
    defaults:
      run:
        shell: bash
    runs-on: "ubuntu-latest"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Read the lowest supported version out of pyproject.toml
        id: floor
        run: |
          VER=$(grep -oE 'requires-python *= *"[^"]*"' pyproject.toml \
                | grep -oE '>=3\.[0-9]+' | cut -c3-)
          test -n "$VER" || { echo "no >=3.x in requires-python"; exit 1; }
          echo "Untergrenze laut pyproject.toml: $VER"
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.floor.outputs.version }}
      - name: Install the package the way a user would
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Unit tests
        run: pytest -q
