name: Unit test matrix

on:
  workflow_dispatch:   # to run it manually
  # Once a week, so that the day a dependency drops Python 3.10 (or 3.14 breaks
  # something) shows up here and not in a user's report. Two things about cron
  # in Actions: a schedule only ever runs the copy of this file on the default
  # branch, and GitHub disables scheduled workflows in a repository that has
  # seen no activity for 60 days. The minute is not 0 on purpose -- most
  # schedules sit on the hour, and runs there get queued behind them.
  schedule:
    - cron: '37 5 * * 1'   # Mondays, 05:37 UTC

jobs:
  check-all:
    strategy:
      # Without this one red cell cancels the rest, and the question "which
      # combinations are broken" turns back into "one of them is".
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest", "macos-latest", "windows-latest" ]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Load cached venv
        id: cached-pip-wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Install library
        run: poetry install --no-interaction
      - name: Unit tests
        run: |
          source $VENV
          pytest
