# Triggered by a new release, it will do a basic check on version number and unit tests.
# Then it will build the binaries and creates the binary release assets and the downloadable
# tools for Arduino
# Finally, it will upload the new version to PyPI
name: Release workflow

on:
  release:
    types: [published]
  workflow_dispatch: # to run it manually

jobs:
  check:
    defaults:
      run:
        shell: bash
    runs-on: "ubuntu-24.04"
    steps:
      # Before anything is checked out or built: a release is cut from main. The
      # local prepare_release.sh says the same, but that is a pre-flight check
      # one runs by hand, while a tag can be created in the web interface on any
      # branch -- and then the whole release would ship whatever that branch
      # happens to contain. target_commitish is what the tag was created on, a
      # branch name or, if it was made on a commit, that commit's SHA, which is
      # not main either and fails here just as well.
      - name: A release comes from main
        if: ${{ github.event.release.tag_name != '' }}
        run: |
          echo "Release was created on: ${{ github.event.release.target_commitish }}"
          test "${{ github.event.release.target_commitish }}" = main

      - name: Check out repository
        if: ${{ github.event.release.tag_name != '' }}
        uses: actions/checkout@v5

      - name: Set up python
        if: ${{ github.event.release.tag_name != '' }}
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        if: ${{ github.event.release.tag_name != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install .  # Install dependencies

      - name: Test release against system version
        if: ${{ github.event.release.name != '' }}
        run: |
          VER=$(python pyavrocd/main.py -V)
          VERSTRING=v${VER#*version }
          VERSTRING=${VERSTRING%rc*}
          REL_NAME=${{ github.event.release.name }}
          echo "System version string: $VERSTRING"
          echo "Github release name: $REL_NAME"
          if [[ -z "$REL_NAME" ]]; then
             REL_NAME=$VERSTRING
             echo "Adapted GitHub release name to system version string"
          fi
          if [[ "$VERSTRING" != "$REL_NAME" ]]; then
             echo "Release version does not match system version"
             exit 1
          fi
          echo "Release and system version are identical, now we continue"

      # Also three steps, for a different reason than in unit-tests.yml: here
      # all three are meant to stop the release, but a single run block would
      # report only the first of them. With !cancelled() each one runs and the
      # job still fails, so one release attempt tells you everything that is
      # wrong rather than one thing at a time.
      - name: Type check
        if: ${{ github.event.release.tag_name != '' }}
        run: mypy .
      - name: Lint
        if: ${{ !cancelled() && github.event.release.tag_name != '' }}
        run: pylint pyavrocd
      - name: Unit tests
        if: ${{ !cancelled() && github.event.release.tag_name != '' }}
        run: pytest tests

  build-binaries:
    needs: check
    strategy:
      fail-fast: false
      matrix:
       os: [ arm64-apple-darwin, aarch64-linux-gnu,  x86_64-mingw32,  x86_64-apple-darwin,  x86_64-linux-gnu, i686-mingw32]
       include:
         - os: arm64-apple-darwin
           runner: macos-14
           arch: arm64
         - os: aarch64-linux-gnu
           runner: ubuntu-24.04-arm
           arch: arm64
         - os: x86_64-mingw32
           runner: windows-2022
           arch: x64
         - os: x86_64-apple-darwin
           runner: macos-14-large
           arch: x64
         - os: x86_64-linux-gnu
           runner: ubuntu-24.04
           arch: x64
         - os: i686-mingw32
           runner: windows-2022
           arch: x86
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python

        uses: actions/setup-python@v6
        if: ${{ !contains(matrix.os, 'linux') }}
        with:
          # for Linux use native Python so that staticx can work!
          python-version: '3.14'
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .  # Install dependencies

      - name: Package PyAvrOCD with PyInstaller
        run: |
          pyinstaller -y pyavrocd.spec

      - name: Run pyavrocd
        run: |
          dist/pyavrocd/pyavrocd -V
          dist/pyavrocd/pyavrocd -d ? -t ?

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: dist/pyavrocd/*
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error # 'warn' or 'ignore' are also available, defaults to `warn`

  build-armhf-binary:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Qemu run
        uses: pguyot/arm-runner-action@v2
        id: build_image
        with:
          cpu: arm1176
          import_github_env: true
          copy_artifact_path: dist
          base_image: raspios_lite:latest
          image_additional_mb: 2048
          commands: |
            uname -a
            python3 --version
            ldd --version
            df -h /
            sudo apt update -y
            sudo apt upgrade -y
            sudo apt install -y git
            sudo apt install -y scons
            sudo apt install -y python3-pip
            sudo apt install -y python3.13-venv
            python3 -m venv env
            . ./env/bin/activate
            pip install --no-input .
            pyinstaller -y pyavrocd.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arm-linux-gnueabihf
          path: dist/pyavrocd/*
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error # 'warn' or 'ignore' are also available, defaults to `warn`

  build-i686-linux-binary:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build in a 32-bit Debian container
        # PyInstaller cannot cross-compile: it packs the interpreter it is
        # running under, so a 32-bit client needs a 32-bit Python on a machine
        # that executes 32-bit code. GitHub has no i686 Linux runner -- but an
        # x86_64 runner runs i386 code natively, so a container is enough and no
        # QEMU is involved, unlike the armhf job above.
        #
        # The container has to be Debian: Ubuntu reduced i386 to a handful of
        # library packages and has no python3 for it. Bookworm brings Python
        # 3.11, and GLIBC 2.36 is the floor that follows from it.
        #
        # The script goes in through stdin ('bash -s'), which keeps it free of
        # the quoting a 'bash -c' string would need. -e stops at the first
        # failure, -x puts every command in the log.
        run: |
          docker run --rm -i --platform linux/386 \
            -v "$PWD":/src -w /src \
            i386/debian:bookworm bash -exs <<'SCRIPT'
          uname -m
          apt-get update
          # Python plus a compiler, and no more than that: hidapi arrives as a
          # prebuilt manylinux_2_28_i686 wheel, so no libusb or libudev headers
          # are needed, and svd2py is pure Python and pulls no lxml. What does
          # get built from source is markupsafe and pyyaml.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 python3-venv python3-dev build-essential
          python3 --version
          ldd --version | head -1
          python3 -m venv /tmp/env
          /tmp/env/bin/pip install --upgrade pip
          /tmp/env/bin/pip install .
          rm -rf dist build
          /tmp/env/bin/pyinstaller -y pyavrocd.spec
          # Does the packed client start? -V answers from the frozen interpreter,
          # the two lists walk the device and tool tables, which is where a
          # missing hidden import shows up.
          ./dist/pyavrocd/pyavrocd -V
          ./dist/pyavrocd/pyavrocd -d '?' -t '?'
          SCRIPT

      - name: Hand the files back
        # The container runs as root, so everything it wrote belongs to root on
        # the host too, and the upload step could not read it.
        run: sudo chown -R "$(id -u):$(id -g)" dist build

      - name: What it demands of the system
        # Measured, not assumed. readelf reads i386 ELF on an x86_64 host
        # without further ado.
        run: |
          file dist/pyavrocd/pyavrocd
          readelf -d dist/pyavrocd/pyavrocd | grep NEEDED || echo "(nothing)"
          echo "highest glibc requirement over everything shipped:"
          find dist/pyavrocd -type f -print0 \
            | xargs -0 -I{} sh -c 'readelf -V "{}" 2>/dev/null | grep -o "GLIBC_2\.[0-9]*"' \
            | sort -uV | tail -1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: i686-linux-gnu
          path: dist/pyavrocd/*
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error

  build-assets:
    needs: [build-binaries, build-armhf-binary, build-i686-linux-binary]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download arm-linux-gnueabihf
        uses: actions/download-artifact@v7
        with:
          name: arm-linux-gnueabihf
          path: extras/binaries/arm-linux-gnueabihf

      - name: Download arm64-apple-darwin
        uses: actions/download-artifact@v7
        with:
          name: arm64-apple-darwin
          path: extras/binaries/arm64-apple-darwin

      - name: Download aarch64-linux-gnu
        uses: actions/download-artifact@v7
        with:
          name: aarch64-linux-gnu
          path: extras/binaries/aarch64-linux-gnu

      - name: Download x86_64-mingw32
        uses: actions/download-artifact@v7
        with:
          name: x86_64-mingw32
          path: extras/binaries/x86_64-mingw32

      - name: Download i686-mingw32
        uses: actions/download-artifact@v7
        with:
          name: i686-mingw32
          path: extras/binaries/i686-mingw32

      - name: Download x86_64-apple-darwin
        uses: actions/download-artifact@v7
        with:
          name: x86_64-apple-darwin
          path: extras/binaries/x86_64-apple-darwin

      - name: Download x86_64-linux-gnu
        uses: actions/download-artifact@v7
        with:
          name: x86_64-linux-gnu
          path: extras/binaries/x86_64-linux-gnu

      - name: Download i686-linux-gnu
        uses: actions/download-artifact@v7
        with:
          name: i686-linux-gnu
          path: extras/binaries/i686-linux-gnu

      - name: Packing
        run: bash extras/packer.sh

      - name: Asset upload
        uses: softprops/action-gh-release@v3
        with:
          files: extras/assets/*.tar.gz

  build-pypi-distribution:
    name: Build distribution
    needs: build-assets
    runs-on: ubuntu-24.04

    steps:
    - name: check for tag
      if: ${{ github.event.release.tag_name == '' }}
      run: exit 1

    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python distribution to PyPI
    if: ${{ !contains(github.event.release.name,'a') && !contains(github.event.release.name,'b') && github.event.release.name != '' }}
    needs:
    - build-pypi-distribution
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/PyAvrOCD  # Replace <package-name> with your PyPI project name
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v7
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
